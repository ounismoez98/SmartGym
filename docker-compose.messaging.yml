services:
  ollama:
    image: ollama/ollama:0.12.5
    profiles:
      - ai
    expose:
      - "11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
volumes:
  ollama-data:
