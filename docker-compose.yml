services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartgym
      POSTGRES_USER: smartgym
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set local secrets}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - smartgym-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartgym -d smartgym"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set local secrets}
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set local secrets}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: http://localhost:8080
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro
      - ./keycloak/realm-import:/opt/keycloak/data/import:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Single private shared broker for the Smart Gym modules. Applications
  # declare their own durable exchanges, queues, bindings, and retry topology.
  rabbitmq:
    image: rabbitmq:4.1.2-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-smartgym}
    expose:
      - "5672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/smartgym
      SPRING_DATASOURCE_USERNAME: smartgym
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set local secrets}
      APP_SECURITY_ISSUER_URI: http://localhost:8080/realms/smart-gym
      APP_SECURITY_JWK_SET_URI: http://keycloak:8080/realms/smart-gym/protocol/openid-connect/certs
      APP_PROVISIONING_TOKEN: ${PROVISIONING_TOKEN:?Set PROVISIONING_TOKEN in .env}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  training-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set local secrets}
      TRAINING_DB_USER: ${TRAINING_DB_USER:-training_service}
      TRAINING_DB_PASSWORD: ${TRAINING_DB_PASSWORD:-training-local-change-me}
      TRAINING_DB_NAME: training_db
    volumes:
      - ./scripts/provision-training-db.sql:/provision-training-db.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        psql -h postgres -U smartgym -d smartgym -v ON_ERROR_STOP=1
        -v training_db_user="$${TRAINING_DB_USER}"
        -v training_db_password="$${TRAINING_DB_PASSWORD}"
        -v training_db_name="$${TRAINING_DB_NAME}"
        -f /provision-training-db.sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  training-service:
    build:
      context: ./training-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/training_db
      SPRING_DATASOURCE_USERNAME: ${TRAINING_DB_USER:-training_service}
      SPRING_DATASOURCE_PASSWORD: ${TRAINING_DB_PASSWORD:-training-local-change-me}
      APP_SECURITY_ISSUER_URI: http://localhost:8080/realms/smart-gym
      APP_SECURITY_JWK_SET_URI: http://keycloak:8080/realms/smart-gym/protocol/openid-connect/certs
      APP_SECURITY_AUDIENCE: smart-gym-api
      APP_MEMBERSHIP_BASE_URL: http://api:8081
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      SPRING_RABBITMQ_VIRTUAL_HOST: ${RABBITMQ_VHOST:-smartgym}
      APP_AI_OLLAMA_BASE_URL: http://ollama:11434
      APP_AI_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      training-db-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    ports:
      - "8088:80"
    depends_on:
      - api
      - training-service

volumes:
  smartgym-db:
  keycloak-db:
  rabbitmq-data:
