server:
  port: 8082

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/training_db}
    username: ${SPRING_DATASOURCE_USERNAME:training}
    password: ${SPRING_DATASOURCE_PASSWORD:training}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false
        retry:
          enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api/training/openapi
  swagger-ui:
    path: /api/training/swagger-ui
    url: /api/training/openapi

app:
  ai:
    messaging:
      enabled: ${APP_AI_MESSAGING_ENABLED:true}
    ollama:
      base-url: ${APP_AI_OLLAMA_BASE_URL:http://localhost:11434}
      model: ${APP_AI_OLLAMA_MODEL:qwen2.5:3b}
      timeout: ${APP_AI_OLLAMA_TIMEOUT:90s}
  membership:
    base-url: ${APP_MEMBERSHIP_BASE_URL:http://localhost:8081}
  security:
    issuer-uri: ${APP_SECURITY_ISSUER_URI:http://localhost:8080/realms/smart-gym}
    jwk-set-uri: ${APP_SECURITY_JWK_SET_URI:http://localhost:8080/realms/smart-gym/protocol/openid-connect/certs}
    audience: ${APP_SECURITY_AUDIENCE:smart-gym-api}
