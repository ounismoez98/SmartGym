server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartgym}
    username: ${SPRING_DATASOURCE_USERNAME:smartgym}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}

app:
  keycloak:
    admin:
      base-url: ${KEYCLOAK_ADMIN_URL:http://keycloak:8080}
      realm: ${KEYCLOAK_REALM:gym}
      client-id: ${KEYCLOAK_PROVISIONER_CLIENT_ID:smartgym-provisioner}
      client-secret: ${KEYCLOAK_PROVISIONER_SECRET:}
  security:
    issuer-uri: ${APP_SECURITY_ISSUER_URI:http://localhost:8180/realms/gym}
    jwk-set-uri: ${APP_SECURITY_JWK_SET_URI:http://localhost:8180/realms/gym/protocol/openid-connect/certs}
    audience: smart-gym-api
  provisioning:
    token: ${APP_PROVISIONING_TOKEN:}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:qwen-2.5-32b}
    api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
  llm:
    connect-timeout: ${APP_LLM_CONNECT_TIMEOUT:5s}
    read-timeout: ${APP_LLM_READ_TIMEOUT:120s}
    base-url: ${LLM_BASE_URL:https://api.groq.com/openai/v1}
    model: ${LLM_MODEL:openai/gpt-oss-20b}
    api-key: ${LLM_API_KEY:}
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:30}
  mail:
    from: ${APP_MAIL_FROM:no-reply@smartgym.local}
