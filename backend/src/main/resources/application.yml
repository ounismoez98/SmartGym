server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartgym}
    username: ${SPRING_DATASOURCE_USERNAME:smartgym}
    password: ${SPRING_DATASOURCE_PASSWORD:smartgym}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

app:
  security:
    issuer-uri: ${APP_SECURITY_ISSUER_URI:http://localhost:8080/realms/smart-gym}
    jwk-set-uri: ${APP_SECURITY_JWK_SET_URI:http://localhost:8080/realms/smart-gym/protocol/openid-connect/certs}
    audience: smart-gym-api
  provisioning:
    token: ${APP_PROVISIONING_TOKEN:}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:qwen-2.5-32b}
    api-url: ${GROQ_API_URL:https://api.groq.com/openai/v1/chat/completions}
