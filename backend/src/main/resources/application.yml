server:
  port: 8081

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smartgym}
    username: ${SPRING_DATASOURCE_USERNAME:smartgym}
    password: ${SPRING_DATASOURCE_PASSWORD:smartgym}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

app:
  security:
    issuer-uri: ${APP_SECURITY_ISSUER_URI:http://localhost:8080/realms/gym}
    jwk-set-uri: ${APP_SECURITY_JWK_SET_URI:http://localhost:8080/realms/gym/protocol/openid-connect/certs}
    audience: smart-gym-api
  provisioning:
    token: ${APP_PROVISIONING_TOKEN:}
